name: Bug report
description: Report reproducible incorrect behavior.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not attach sensitive briefs or deliverables. Replace private content with a minimal fixture.
  - type: textarea
    id: behavior
    attributes:
      label: What happened?
      description: Include the expected result and the result BriefLint produced.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Provide non-sensitive requirement text, filenames, and steps.
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and operating system
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed private, copyrighted, or personally identifying content.
          required: true
